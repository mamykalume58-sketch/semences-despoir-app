name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Le dépôt ne contient que lib/ + pubspec.yaml : on génère le dossier android/
      # dans un dossier temporaire puis on ne copie que android/.
      - name: Générer android/
        run: |
          flutter create --platforms=android --org com.semencesdespoir --project-name semences_despoir "$RUNNER_TEMP/scaffold"
          cp -r "$RUNNER_TEMP/scaffold/android" ./android

      - name: Permission Internet + nom de l'app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          sed -i 's|android:label="[^"]*"|android:label="VPLA"|' "$MANIFEST"
          grep -n "INTERNET\|android:label" "$MANIFEST"

      - name: Firebase (google-services)
        run: |
          cp google-services.json android/app/google-services.json
          sed -i '/id("com.android.application") version/a\    id("com.google.gms.google-services") version "4.4.4" apply false' android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          grep -n "google-services" android/settings.gradle.kts android/app/build.gradle.kts
      - name: Signature release (keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          GRADLE=android/app/build.gradle.kts
          awk '/^android {/{print; print "    signingConfigs {"; print "        create(\"release\") {"; print "            storeFile = file(\"release.jks\")"; print "            storePassword = System.getenv(\"KEYSTORE_PASSWORD\")"; print "            keyAlias = System.getenv(\"KEY_ALIAS\")"; print "            keyPassword = System.getenv(\"KEY_PASSWORD\")"; print "        }"; print "    }"; next} {print}' "$GRADLE" > "$GRADLE.tmp" && mv "$GRADLE.tmp" "$GRADLE"
          sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/' "$GRADLE"
          grep -n "signingConfig\|release.jks" "$GRADLE"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"


      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - name: Extraire la version depuis pubspec.yaml
        id: version
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION_NAME+$VERSION_CODE"

      - name: Créer la GitHub Release avec l'APK
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}"
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "$TAG" \
            --notes "Build automatique." \
            --repo "${{ github.repository }}"
          TAG_URL=$(echo "$TAG" | sed 's/+/%2B/g')
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG_URL/app-release.apk"
          SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Publier la version dans Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_SEMENCES: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEMENCES }}
          PACKAGE_NAME: com.semencesdespoir.semences_despoir
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          DOWNLOAD_URL: ${{ steps.release.outputs.download_url }}
          SIZE_BYTES: ${{ steps.release.outputs.size_bytes }}
        run: |
          pip install --break-system-packages requests pyjwt
          python3 scripts_publish_version.py

      - uses: actions/upload-artifact@v4
        with:
          name: semences-despoir-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
