name: Générer la plateforme iOS (à lancer une seule fois)

on:
  workflow_dispatch: {}

jobs:
  add-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ajouter la cible iOS au projet existant
        run: flutter create --platforms=ios --org com.vivrepourlesautres .

      - name: Forcer le bundle ID exact
        run: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.vivrepourlesautres.app;/' \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Vérifier que le bundle ID est bien appliqué
        run: grep -n "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj

      - name: Committer le dossier ios/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/
          git commit -m "Ajout de la plateforme iOS (bundle com.vivrepourlesautres.app)"
          git push
