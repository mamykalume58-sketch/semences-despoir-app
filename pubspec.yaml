name: semences_despoir
description: Vivre pour les Autres — application mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  firebase_core: ^4.1.1
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.1.1
  http: ^1.2.2
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  package_info_plus: ^8.1.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/vpla_icon_v2.png"
